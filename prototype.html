<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Child-IA — Prototype Pédagogique</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { app: ['"Quicksand"', 'sans-serif'] },
        },
      },
    };
  </script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Quicksand', sans-serif; margin: 0; }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.1); }
    }
    .heart-beat { animation: heartbeat 1.2s ease-in-out infinite; }

    @keyframes orbit1 { 0% { transform: rotate(0deg) translateX(40px) rotate(0deg); } 100% { transform: rotate(360deg) translateX(40px) rotate(-360deg); } }
    @keyframes orbit2 { 0% { transform: rotate(0deg) translateX(65px) rotate(0deg); } 100% { transform: rotate(360deg) translateX(65px) rotate(-360deg); } }
    @keyframes orbit3 { 0% { transform: rotate(0deg) translateX(90px) rotate(0deg); } 100% { transform: rotate(360deg) translateX(90px) rotate(-360deg); } }
    .orbit-1 { animation: orbit1 3s linear infinite; }
    .orbit-2 { animation: orbit2 5s linear infinite; }
    .orbit-3 { animation: orbit3 8s linear infinite; }

    @keyframes sun-glow {
      0%, 100% { filter: drop-shadow(0 0 6px #FFD93D); }
      50% { filter: drop-shadow(0 0 14px #FFA500); }
    }
    .sun-glow { animation: sun-glow 2s ease-in-out infinite; }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadein 0.4s ease-out forwards; }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60% { content: '...'; }
      80%, 100% { content: ''; }
    }

    .typing-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #A78BFA; margin: 0 3px; }
    .typing-dot:nth-child(1) { animation: bounce 1.2s ease-in-out 0s infinite; }
    .typing-dot:nth-child(2) { animation: bounce 1.2s ease-in-out 0.2s infinite; }
    .typing-dot:nth-child(3) { animation: bounce 1.2s ease-in-out 0.4s infinite; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 3px; }
  </style>
</head>
<body class="bg-gradient-to-br from-orange-50 via-purple-50 to-blue-50 min-h-screen">
  <div id="root"></div>

  <!-- Clé API chargée depuis config.js (gitignored) -->
  <script src="config.js"></script>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    /* ── System prompt ── */
    const SYSTEM_PROMPT = `Tu es une IA pédagogique pour enfants de 8-11 ans. Règles absolues :
1. Maximum 3 phrases.
2. Commence toujours par une analogie avec du vécu d'enfant (dispute dans la cour, jouet, repas...).
3. Ta dernière phrase doit contenir une légère incongruité ou absurdité douce — quelque chose qui gratte et donne envie de poser une autre question. Jamais de réponse encyclopédique. Langue : français.`;

    /* ── Artifact detection ── */
    function detectArtifact(question) {
      const q = question.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      if (/coeur|c\u0153ur|sang|corps|poumon/.test(q)) return 'heart';
      if (/espace|planete|soleil|lune|etoile|mars|jupiter/.test(q)) return 'space';
      if (/guerre|hitler|mort|soldat|armee|bombe/.test(q)) return 'war';
      return null;
    }

    /* ── Split last sentence as aporia ── */
    function splitAporia(text) {
      const trimmed = text.trim();
      const re = /([^.!?]*[.!?]+)\s*/g;
      const sentences = [];
      let m;
      while ((m = re.exec(trimmed)) !== null) sentences.push(m[1].trim());
      if (sentences.length === 0) return { body: '', aporia: trimmed };
      if (sentences.length === 1) return { body: '', aporia: sentences[0] };
      const aporia = sentences.pop();
      return { body: sentences.join(' '), aporia };
    }

    /* ── Heart SVG ── */
    function HeartArtifact() {
      return (
        <div className="flex flex-col items-center gap-3">
          <svg viewBox="0 0 120 120" width="100" height="100" className="heart-beat">
            <defs>
              <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#FF6B6B" />
                <stop offset="100%" stopColor="#EE5A24" />
              </linearGradient>
            </defs>
            <path d="M60 100 C30 75 5 55 5 35 C5 18 18 5 33 5 C43 5 52 11 60 22 C68 11 77 5 87 5 C102 5 115 18 115 35 C115 55 90 75 60 100Z" fill="url(#hg)" />
            {/* Artery lines */}
            <path d="M45 45 L55 35 L60 50 L65 30 L75 45" stroke="white" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round" opacity="0.7" />
          </svg>
          <p className="text-xs text-gray-500 font-semibold text-center max-w-xs">
            Le cœur bat environ <strong className="text-red-500">100 000 fois par jour</strong> et pompe
            assez de sang pour remplir un camion-citerne chaque semaine.
          </p>
        </div>
      );
    }

    /* ── Solar System SVG ── */
    function SpaceArtifact() {
      return (
        <div className="flex flex-col items-center gap-3">
          <svg viewBox="0 0 220 220" width="200" height="200">
            {/* Orbits */}
            <circle cx="110" cy="110" r="40" fill="none" stroke="#E5E7EB" strokeWidth="1" strokeDasharray="3 3" />
            <circle cx="110" cy="110" r="65" fill="none" stroke="#E5E7EB" strokeWidth="1" strokeDasharray="3 3" />
            <circle cx="110" cy="110" r="90" fill="none" stroke="#E5E7EB" strokeWidth="1" strokeDasharray="3 3" />
            {/* Sun */}
            <circle cx="110" cy="110" r="16" fill="#FFD93D" className="sun-glow" />
            <circle cx="110" cy="110" r="10" fill="#FFA500" />
            {/* Mercury */}
            <g style={{transformOrigin: '110px 110px'}} className="orbit-1">
              <circle cx="110" cy="110" r="5" fill="#B0BEC5" />
            </g>
            {/* Earth */}
            <g style={{transformOrigin: '110px 110px'}} className="orbit-2">
              <circle cx="110" cy="110" r="7" fill="#3B82F6" />
              <circle cx="115" cy="108" r="2.5" fill="#22C55E" />
            </g>
            {/* Mars */}
            <g style={{transformOrigin: '110px 110px'}} className="orbit-3">
              <circle cx="110" cy="110" r="6" fill="#EF4444" />
            </g>
            {/* Stars */}
            <circle cx="20" cy="30" r="1.5" fill="#CBD5E1" />
            <circle cx="190" cy="25" r="1" fill="#CBD5E1" />
            <circle cx="35" cy="180" r="1.2" fill="#CBD5E1" />
            <circle cx="185" cy="190" r="1.5" fill="#CBD5E1" />
            <circle cx="15" cy="110" r="1" fill="#CBD5E1" />
            <circle cx="200" cy="100" r="1.3" fill="#CBD5E1" />
          </svg>
          <p className="text-xs text-gray-500 font-semibold text-center max-w-xs">
            La lumière du Soleil met <strong className="text-amber-500">8 minutes</strong> pour arriver
            sur Terre — tu regardes toujours le soleil du passé.
          </p>
        </div>
      );
    }

    /* ── War context card ── */
    function WarArtifact() {
      return (
        <div className="flex gap-3 items-start">
          <div className="text-2xl mt-0.5">🕊️</div>
          <div>
            <p className="text-sm text-gray-700 leading-relaxed">
              La guerre, c'est quand des pays n'arrivent plus à se parler et utilisent
              des armées à la place des mots. Au XX<sup>e</sup> siècle, les deux guerres
              mondiales ont causé la mort de <strong className="text-orange-600">plus de 80 millions de personnes</strong>.
            </p>
            <p className="text-xs text-gray-400 mt-2 italic">
              Aujourd'hui, des organisations comme l'ONU essaient d'aider les pays à résoudre
              leurs problèmes sans violence.
            </p>
          </div>
        </div>
      );
    }

    /* ── Artifact Card wrapper ── */
    function ArtifactCard({ type }) {
      const labels = {
        heart: { icon: '🫀', title: 'Le corps humain' },
        space: { icon: '🚀', title: 'L\'Espace' },
        war: { icon: '🕊️', title: 'Artefact contextuel' },
      };
      const info = labels[type];
      const components = { heart: HeartArtifact, space: SpaceArtifact, war: WarArtifact };
      const Comp = components[type];

      return (
        <div className="mt-3 rounded-2xl border-2 border-dashed border-purple-200 bg-purple-50/50 p-4 fade-in">
          <div className="flex items-center gap-2 mb-3 pb-2 border-b border-purple-100">
            <span className="text-base">{info.icon}</span>
            <span className="text-xs font-bold text-purple-500 uppercase tracking-wider">
              Artefact — {info.title}
            </span>
          </div>
          <Comp />
        </div>
      );
    }

    /* ── Chat bubble ── */
    function ChatBubble({ role, text, artifact }) {
      const isUser = role === 'user';

      if (isUser) {
        return (
          <div className="flex justify-end mb-4 fade-in">
            <div className="max-w-[75%] bg-gradient-to-br from-violet-500 to-purple-600 text-white px-5 py-3 rounded-2xl rounded-br-md shadow-md">
              <p className="text-sm leading-relaxed">{text}</p>
            </div>
          </div>
        );
      }

      // AI response — split aporia
      const { body, aporia } = splitAporia(text);

      return (
        <div className="flex justify-start mb-4 fade-in">
          <div className="max-w-[80%]">
            {/* Avatar */}
            <div className="flex items-center gap-2 mb-1.5">
              <div className="w-7 h-7 rounded-full bg-gradient-to-br from-amber-300 to-orange-400 flex items-center justify-center text-xs">
                🦦
              </div>
              <span className="text-xs font-bold text-gray-400">Child-IA</span>
            </div>

            {/* Message body */}
            <div className="bg-white px-5 py-4 rounded-2xl rounded-tl-md shadow-sm border border-gray-100">
              {body && (
                <p className="text-sm text-gray-700 leading-relaxed mb-3">{body}</p>
              )}
              {/* Aporia — highlighted */}
              <div className="bg-gradient-to-r from-amber-50 to-orange-50 border-l-3 border-amber-400 px-4 py-2.5 rounded-lg"
                   style={{ borderLeftWidth: '3px' }}>
                <p className="text-sm text-amber-800 italic font-semibold leading-relaxed">
                  🌀 {aporia}
                </p>
              </div>
            </div>

            {/* Artifact */}
            {artifact && <ArtifactCard type={artifact} />}
          </div>
        </div>
      );
    }

    /* ── Typing indicator ── */
    function TypingIndicator() {
      return (
        <div className="flex justify-start mb-4 fade-in">
          <div className="flex items-center gap-2">
            <div className="w-7 h-7 rounded-full bg-gradient-to-br from-amber-300 to-orange-400 flex items-center justify-center text-xs">
              🦦
            </div>
            <div className="bg-white px-5 py-3 rounded-2xl rounded-tl-md shadow-sm border border-gray-100 flex items-center gap-1">
              <div className="typing-dot"></div>
              <div className="typing-dot"></div>
              <div className="typing-dot"></div>
            </div>
          </div>
        </div>
      );
    }

    /* ── Main App ── */
    function App() {
      const [apiKey, setApiKey] = useState(window.ANTHROPIC_API_KEY || '');
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [keyVisible, setKeyVisible] = useState(false);
      const chatRef = useRef(null);

      useEffect(() => {
        if (chatRef.current) {
          chatRef.current.scrollTop = chatRef.current.scrollHeight;
        }
      }, [messages, loading]);

      const sendMessage = async () => {
        const question = input.trim();
        if (!question || !apiKey.trim()) return;

        setError('');
        const userMsg = { role: 'user', text: question };
        setMessages(prev => [...prev, userMsg]);
        setInput('');
        setLoading(true);

        try {
          const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': apiKey.trim(),
              'anthropic-version': '2023-06-01',
              'anthropic-dangerous-direct-browser-access': 'true',
            },
            body: JSON.stringify({
              model: 'claude-sonnet-4-20250514',
              max_tokens: 400,
              system: SYSTEM_PROMPT,
              messages: [{ role: 'user', content: question }],
            }),
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.error?.message || `Erreur HTTP ${res.status}`);
          }

          const data = await res.json();
          const aiText = data.content?.[0]?.text || 'Hmm, je n\'ai pas réussi à répondre…';
          const artifact = detectArtifact(question);
          setMessages(prev => [...prev, { role: 'ai', text: aiText, artifact }]);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      };

      const hasKey = apiKey.trim().length > 0;

      return (
        <div className="h-screen flex flex-col max-w-2xl mx-auto">

          {/* ── Header ── */}
          <header className="bg-white/80 backdrop-blur-md border-b border-gray-100 px-4 py-3 flex-shrink-0">
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-2">
                <span className="text-2xl">🦦</span>
                <div>
                  <h1 className="text-lg font-bold bg-gradient-to-r from-violet-600 to-orange-500 bg-clip-text text-transparent leading-tight">
                    Child-IA
                  </h1>
                  <p className="text-[10px] text-gray-400 font-semibold">Prototype pédagogique · 8-11 ans</p>
                </div>
              </div>
              <div className="flex items-center gap-1.5">
                <div className={`w-2 h-2 rounded-full ${hasKey ? 'bg-green-400' : 'bg-red-300'}`}></div>
                <span className="text-[10px] text-gray-400 font-medium">
                  {hasKey ? 'API connectée' : 'Clé requise'}
                </span>
              </div>
            </div>

            {/* API Key input */}
            <div className="flex gap-2 items-center">
              <div className="flex-1 relative">
                <input
                  type={keyVisible ? 'text' : 'password'}
                  value={apiKey}
                  onChange={e => setApiKey(e.target.value)}
                  placeholder="Colle ta clé API Anthropic ici (sk-ant-...)"
                  className="w-full text-xs px-3 py-2 pr-8 rounded-xl bg-gray-50 border border-gray-200 outline-none focus:border-violet-300 focus:ring-2 focus:ring-violet-100 transition-all font-mono"
                />
                <button
                  onClick={() => setKeyVisible(!keyVisible)}
                  className="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-xs cursor-pointer"
                >
                  {keyVisible ? '🙈' : '👁️'}
                </button>
              </div>
            </div>
            <p className="text-[9px] text-gray-300 mt-1">Stockée en mémoire uniquement — jamais envoyée ailleurs que l'API Anthropic.</p>
          </header>

          {/* ── Chat area ── */}
          <div ref={chatRef} className="flex-1 overflow-y-auto px-4 py-6 space-y-1">
            {messages.length === 0 && !loading && (
              <div className="flex flex-col items-center justify-center h-full text-center gap-4 opacity-60">
                <div className="text-6xl">🦦</div>
                <div>
                  <p className="text-base font-bold text-gray-500">Pose-moi une question !</p>
                  <p className="text-xs text-gray-400 mt-1 max-w-xs">
                    Essaie « Pourquoi le cœur bat ? », « C'est quoi une étoile ? »
                    ou « Pourquoi les gens font la guerre ? »
                  </p>
                </div>
                <div className="flex gap-2 flex-wrap justify-center mt-2">
                  {['🫀 Le corps', '🚀 L\'espace', '💭 Grandes questions'].map(tag => (
                    <span key={tag} className="text-[10px] px-3 py-1 rounded-full bg-white border border-gray-200 text-gray-500 font-medium">
                      {tag}
                    </span>
                  ))}
                </div>
              </div>
            )}

            {messages.map((msg, i) => (
              <ChatBubble key={i} role={msg.role} text={msg.text} artifact={msg.artifact} />
            ))}

            {loading && <TypingIndicator />}

            {error && (
              <div className="flex justify-center fade-in">
                <div className="bg-red-50 text-red-500 text-xs px-4 py-2 rounded-xl border border-red-100 max-w-sm text-center">
                  ⚠️ {error}
                </div>
              </div>
            )}
          </div>

          {/* ── Input area ── */}
          <div className="flex-shrink-0 bg-white/80 backdrop-blur-md border-t border-gray-100 px-4 py-3">
            <div className="flex gap-2 items-end">
              <input
                type="text"
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={handleKeyDown}
                placeholder={hasKey ? 'Pose ta question ici... 🔍' : 'Entre d\'abord ta clé API ↑'}
                disabled={!hasKey || loading}
                className="flex-1 text-sm px-4 py-3 rounded-2xl bg-gray-50 border border-gray-200 outline-none focus:border-violet-300 focus:ring-2 focus:ring-violet-100 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
              />
              <button
                onClick={sendMessage}
                disabled={!hasKey || !input.trim() || loading}
                className="p-3 rounded-2xl bg-gradient-to-br from-violet-500 to-purple-600 text-white shadow-md hover:shadow-lg hover:scale-105 active:scale-95 transition-all disabled:opacity-40 disabled:hover:scale-100 disabled:cursor-not-allowed cursor-pointer"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13" />
                  <polygon points="22 2 15 22 11 13 2 9 22 2" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
